<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2240">
<title>강의하는아이들 배곧수학학원 이번 주 마케팅 실행 성과</title>
<meta name="description" content="김일동 원장 · 경기 시흥시 배곧동. 2026. 11. 16(월) ~ 11. 22(일) 공개 발행분 주간 성과.">
<meta property="og:type" content="website">
<meta property="og:title" content="강의하는아이들 배곧수학학원 이번 주 마케팅 실행 성과">
<meta property="og:description" content="김일동 원장 · 경기 시흥시 배곧동 · 2026. 11. 16 ~ 11. 22 공개 발행분">
<meta property="og:url" content="https://ildong0311-dot.github.io/">
<meta name="twitter:card" content="summary">
<style>
:root{
  --navy:#122a49;
  --navy-deep:#0d2240;
  --ink:#14263f;
  --ink-soft:#33455c;
  --muted:#7c8ea3;
  --line:#eaeff6;
  --bg:#eef1f6;
  --chip-line:#d7e0ec;
  --gold:#d8a93c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 44px}

/* 헤더 */
.hero{
  background:linear-gradient(158deg,#0b1f3b 0%,#122f55 52%,#1a4a7c 100%);
  border-radius:22px;
  padding:24px 20px 22px;
  color:#fff;
  box-shadow:0 10px 26px rgba(13,34,64,.18);
}
.badge{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#c7d7e8;letter-spacing:-.2px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.hero h1{
  margin:16px 0 0;
  font-size:24px;line-height:1.34;font-weight:800;letter-spacing:-.6px;color:#fff;
}
.hero h1 span{display:block}
.period{margin:16px 0 0;font-size:13px;line-height:1.55;color:#b9cbe0;letter-spacing:-.2px}
.owner{margin:8px 0 0;font-size:13px;color:#b9cbe0;letter-spacing:-.2px}
.stats{display:flex;gap:8px;margin-top:20px}
.stat{
  flex:1;text-align:center;padding:15px 4px 13px;border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;color:#fff;letter-spacing:-.5px}
.stat span{display:block;margin-top:6px;font-size:11px;color:#b9cbe0;letter-spacing:-.3px}

/* 카드 공통 */
.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 6px 18px rgba(20,38,63,.06)}
.summary{margin-top:14px}
.summary h2{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0;padding-bottom:4px}
.srow .lab{font-size:14px;color:var(--ink-soft);letter-spacing:-.3px}
.srow .val{font-size:15.5px;font-weight:800;color:var(--ink);white-space:nowrap;letter-spacing:-.3px}
.srow .val em{font-style:normal;font-size:11px;font-weight:600;color:#93a4b8;margin-left:5px}
.note{margin:14px 0 0;font-size:11.5px;line-height:1.6;color:#93a4b8;letter-spacing:-.2px}

/* 필터 */
.chips{
  display:flex;gap:8px;overflow-x:auto;margin:16px -14px 0;padding:8px 14px 6px;
  position:sticky;top:0;z-index:5;
  background:linear-gradient(to bottom,var(--bg) 78%,rgba(238,241,246,0));
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--chip-line);background:#fff;color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.3px;
  padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 목록 */
.list{display:grid;gap:11px;margin-top:10px}
.item{
  display:flex;gap:12px;background:#fff;border-radius:18px;padding:16px 15px;
  box-shadow:0 5px 14px rgba(20,38,63,.055);
}
.date{
  flex:none;width:52px;align-self:flex-start;text-align:center;
  background:#eaf2fc;border-radius:12px;padding:9px 0 8px;
}
.date .d{display:block;font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.date .w{display:block;margin-top:2px;font-size:11px;color:#7089a3}
.body{flex:1;min-width:0}
.ch{font-size:11px;font-weight:600;color:#5a7796;letter-spacing:-.2px;margin-bottom:5px}
.ttl{margin:0;font-size:15px;font-weight:800;line-height:1.4;color:var(--ink);letter-spacing:-.45px;word-break:keep-all}
.meta{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);letter-spacing:-.2px;word-break:keep-all}
.open{
  display:inline-block;margin-top:13px;padding:10px 22px;border-radius:11px;
  background:var(--ink);color:#fff;text-decoration:none;
  font-size:13px;font-weight:700;letter-spacing:-.2px;
}
.open:active{background:#0a1a2e}
.empty{padding:28px 0;text-align:center;font-size:13px;color:var(--muted)}

.foot{margin:26px 0 0;text-align:center;font-size:11.5px;line-height:1.7;color:#93a4b8;letter-spacing:-.2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="badge"><span class="dot"></span><span id="badge">강의하는아이들 배곧수학학원 · 자체실행반</span></div>
    <h1 id="title"></h1>
    <p class="period" id="period"></p>
    <p class="owner" id="owner"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="card summary">
    <h2>이번 주 요약</h2>
    <div id="summary"></div>
    <p class="note" id="note"></p>
  </section>

  <nav class="chips" id="chips" aria-label="채널 필터"></nav>
  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
(function(){
  var state = { items: [], filter: 'all' };
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function income(item){
    if(item.time) return item.time + ' · ' + item.sub;
    return item.sub;
  }

  function render(){
    var list = document.getElementById('list');
    var rows = state.items.filter(function(it){
      if(state.filter === 'all') return true;
      if(state.filter === 'short') return it.cat === 'tt' || it.cat === 'clip';
      if(state.filter === 'etc') return it.cat === 'place' || it.cat === 'home';
      return it.cat === state.filter;
    });
    if(!rows.length){ list.innerHTML = '<div class="empty">해당 채널의 발행분이 없습니다.</div>'; return; }
    list.innerHTML = rows.map(function(it){
      var p = it.date.split('-');
      return '<article class="item">' +
        '<div class="date"><span class="d">' + p[1] + '/' + p[2] + '</span><span class="w">' + esc(it.dow) + '</span></div>' +
        '<div class="body">' +
          '<div class="ch">' + esc(it.ch) + '</div>' +
          '<h3 class="ttl">' + esc(it.title) + '</h3>' +
          '<p class="meta">' + esc(income(it)) + '</p>' +
          '<a class="open" href="' + esc(it.url) + '" target="_blank" rel="noopener">글 열기</a>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  function bindChips(filters){
    var box = document.getElementById('chips');
    box.innerHTML = filters.map(function(f){
      return '<button class="chip" type="button" data-key="' + f.key + '" aria-pressed="' +
        (f.key === state.filter ? 'true' : 'false') + '">' + esc(f.label) + ' ' + f.count + '</button>';
    }).join('');
    box.addEventListener('click', function(e){
      var b = e.target.closest('.chip'); if(!b) return;
      state.filter = b.dataset.key;
      [].forEach.call(box.querySelectorAll('.chip'), function(c){
        c.setAttribute('aria-pressed', c === b ? 'true' : 'false');
      });
      render();
      window.scrollTo({ top: Math.max(0, box.offsetTop - 8), behavior: 'smooth' });
    });
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('load'); return r.json(); })
    .then(function(d){
      document.getElementById('badge').textContent = d.badge;
      document.getElementById('title').innerHTML =
        '<span>' + esc(d.academy) + '</span><span>' + esc(d.title.replace(d.academy, '').trim()) + '</span>';
      document.getElementById('period').textContent = d.period_label;
      document.getElementById('owner').textContent = d.owner_line;
      document.getElementById('stats').innerHTML = d.stats.map(function(s){
        return '<div class="stat"><b>' + s.value + '</b><span>' + esc(s.label) + '</span></div>';
      }).join('');
      document.getElementById('summary').innerHTML = d.summary.map(function(r){
        return '<div class="srow"><span class="lab">' + esc(r.label) + '</span><span class="val">' +
          esc(r.value) + (r.note ? '<em>' + esc(r.note) + '</em>' : '') + '</span></div>';
      }).join('');
      document.getElementById('note').textContent = d.summary_note || '';
      document.getElementById('foot').innerHTML =
        esc(d.academy) + '<br>' + esc(d.owner_line) + ' · 매주 화요일 갱신';
      state.items = d.items || [];
      bindChips(d.filters || []);
      render();
    })
    .catch(function(){
      document.getElementById('list').innerHTML =
        '<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
    });
})();
</script>
</body>
</html>
